<body class="login-body">

<!-- Fundo: grid sutil + halo do gradiente da marca -->
<div class="login-bg" aria-hidden="true">
  <div class="login-grid"></div>
  <div class="login-halo"></div>
</div>

<main class="login-wrap">
  <section class="login-card" role="region" aria-labelledby="loginTitle">

    <div class="login-brand">
      <img src="../assets/logo/HiferaIcon.png" alt="">
      <span>
        <strong>HIFERA <span class="grad-text">COMPANY</span></strong>
        <small>Painel administrativo</small>
      </span>
    </div>

    <div class="login-lock" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
        <circle cx="12" cy="15.5" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <h1 id="loginTitle">Área restrita</h1>
    <p class="login-sub">
      Acesso exclusivo para a equipe Hifera. Autentique-se com a sua conta
      corporativa Microsoft para abrir a Gestão de Projetos.
    </p>

    <button type="button" class="btn-ms" id="btnMicrosoft">
      <svg class="ms-logo" viewBox="0 0 23 23" aria-hidden="true">
        <rect x="1"  y="1"  width="10" height="10" fill="#f25022"/>
        <rect x="12" y="1"  width="10" height="10" fill="#7fba00"/>
        <rect x="1"  y="12" width="10" height="10" fill="#00a4ef"/>
        <rect x="12" y="12" width="10" height="10" fill="#ffb900"/>
      </svg>
      <span class="btn-ms-label">Entrar com a Microsoft</span>
      <span class="btn-ms-spin" aria-hidden="true"></span>
    </button>

    <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>

    <div class="login-divider"><span>ou</span></div>

    <a href="../" class="login-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 19l-7-7 7-7"/></svg>
      Voltar para o site
    </a>

    <p class="login-mock">
      <span class="mock-dot"></span>
      Ambiente de protótipo — autenticação simulada, sem MSAL real ainda.
    </p>

  </section>
</main>
