<!doctype html>
<html lang="pt-BR">
<head>

<title>404 — Hifera Company</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="/assets/logo/HiferaIcon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; height:100%; background:#0a0a0b; color:#f2f2f4;
    font-family:Poppins, system-ui, sans-serif; }
  main { min-height:100%; display:flex; align-items:center; justify-content:center;
    padding:48px 24px; text-align:center; }
  .box { max-width:520px; }
  .marca { font: 700 14px Poppins, sans-serif; letter-spacing:.18em;
    color:#a1a1aa; text-transform:uppercase; margin-bottom:40px; }
  .marca strong { color:#fff; }
  .marca em { font-style:normal;
    background:linear-gradient(135deg,#5de0e6 0%, #4d9fe8 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 { font: 700 clamp(72px, 14vw, 128px) Poppins, sans-serif;
    line-height:1; margin:0;
    background:linear-gradient(135deg,#5de0e6 0%, #004aad 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  h2 { font: 600 24px Poppins, sans-serif; color:#fff; margin:16px 0 8px; letter-spacing:-0.02em; }
  p  { font-size:16px; line-height:1.6; color:#a1a1aa; margin:0 0 32px; }
  a.btn { display:inline-block; min-height:48px; padding:14px 26px;
    border-radius:14px; font: 600 15px Poppins, sans-serif;
    color:#fff; text-decoration:none;
    background:linear-gradient(135deg,#5de0e6 0%, #004aad 100%);
    box-shadow:0 10px 30px -12px rgba(0,74,173,.9); }
</style>
</head>
<body>
<main>
  <div class="box">
    <div class="marca"><strong>HI</strong><em>FERA</em> COMPANY</div>
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>O link pode ter expirado ou essa página mudou de lugar.</p>
    <a class="btn" href="/">Voltar ao site</a>
  </div>
</main>
</body>
</html>
