<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acessar · Hifera Company</title>
<meta name="description" content="Acesse sua conta na Hifera Company.">
<meta name="theme-color" content="#0f0f10">

<link rel="icon" type="image/png" href="../../public/img/logo/HiferaIcon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../public/css/styles.css">
<script src="../../app/controllers/ThemeController.js"></script>
<meta name="robots" content="noai, noimageai">
</head>
<body data-mode="login">

<div data-nav></div>

<main class="auth-shell">
  <div class="auth-card">

    <div class="text-center" style="margin-bottom: 32px;">
      <a href="../../index.html" class="nav-logo" style="justify-content: center;">
        <img class="nav-logo-img" src="../../public/img/logo/HiferaIcon.png" alt="">
      </a>
      <h1 id="auth-title" class="h3" style="margin-top: 8px;">Bem-vindo de volta</h1>
      <p id="auth-sub" class="text-sm text-muted" style="margin-top: 8px;">
        Acesse seu painel da Hifera Company.
      </p>
    </div>

    <div class="auth-tabs" id="auth-tabs" role="tablist">
      <button class="auth-tab is-active" data-mode="login" role="tab" aria-selected="true">Entrar</button>
      <button class="auth-tab" data-mode="signup" role="tab" aria-selected="false">Criar conta</button>
    </div>

    <form id="auth-form" novalidate>

      <div class="form-field" data-signup-only style="display: none;">
        <label for="name">Nome completo</label>
        <input class="form-input" type="text" id="name" name="name" placeholder="Como te chamamos?">
      </div>

      <div class="form-field">
        <label for="email">E-mail</label>
        <input class="form-input" type="email" id="email" name="email" required placeholder="voce@empresa.com" autocomplete="email">
      </div>

      <div class="form-field">
        <label for="password">Senha</label>
        <span class="input-wrap">
          <input class="form-input" type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="eye-toggle" aria-label="Mostrar senha">
            <svg class="eye-open"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.79 19.79 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.79 19.79 0 0 1-2.06 3.19M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </span>
      </div>

      <div class="form-field" data-signup-only style="display: none;">
        <label for="confirm">Confirmar senha</label>
        <input class="form-input" type="password" id="confirm" name="confirm" placeholder="Repita a senha">
      </div>

      <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
        <a href="#" id="forgot" class="text-sm text-muted">Esqueci minha senha</a>
      </div>

      <button type="submit" id="auth-submit" class="btn btn-primary" style="width: 100%;">
        <span id="auth-submit-label">Entrar</span>
        <span class="arrow">→</span>
      </button>

      <div id="auth-msg" class="auth-msg"></div>
    </form>

    <p id="footer-prompt" class="text-sm text-muted text-center" style="margin-top: 24px;">
      Não tem conta? <a href="#" data-go="signup" style="color: var(--cyan);">Criar agora</a>
    </p>

    <div class="text-center" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);">
      <a href="../../index.html" class="text-sm text-muted">← Voltar para o site</a>
    </div>
  </div>
</main>

<div data-footer></div>

<script src="../../app/models/ApiModel.js"></script>
<script src="../../app/models/AuthModel.js"></script>
<script src="../../app/controllers/LayoutController.js"></script>
<script src="../../app/controllers/LoginController.js"></script>

</body>
</html>
