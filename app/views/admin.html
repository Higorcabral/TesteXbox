<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel · Hifera Company</title>
<meta name="theme-color" content="#0f0f10">

<link rel="icon" type="image/png" href="../../public/img/logo/HiferaIcon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../public/css/styles.css">
<script src="../../app/controllers/ThemeController.js"></script>
</head>
<body>

<div data-nav></div>

<main class="admin-shell">
  <div class="container">

    <!-- Cabeçalho -->
    <div class="admin-header">
      <div>
        <div class="eyebrow" style="margin-bottom: 8px;"><span>Painel do gestor</span></div>
        <h1 class="h2" style="font-size: var(--fs-2xl);">Catálogo de soluções</h1>
        <p class="text-sm text-muted" style="margin-top: 4px;">Gerencie as soluções prontas exibidas no site público.</p>
      </div>
      <div class="admin-user">
        <div class="avatar" id="user-avatar">HC</div>
        <div>
          <strong id="user-name">-</strong>
          <small id="user-email">-</small>
        </div>
        <a href="#" id="btn-logout" class="btn btn-ghost btn-sm" style="margin-left: 8px;">Sair</a>
      </div>
    </div>

    <!-- Estatísticas -->
    <div class="stat-grid">
      <div class="stat-card">
        <span class="stat-label">Total</span>
        <span class="stat-value grad" id="stat-total">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Disponíveis</span>
        <span class="stat-value" id="stat-available">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Em breve</span>
        <span class="stat-value" id="stat-soon">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Indisponíveis</span>
        <span class="stat-value" id="stat-unavailable">-</span>
      </div>
    </div>

    <!-- Barra de ferramentas -->
    <div class="admin-toolbar">
      <input class="admin-search" type="search" id="search" placeholder="Buscar por título ou descrição…">
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all">Todos</button>
        <button class="filter-pill" data-filter="available">Disponíveis</button>
        <button class="filter-pill" data-filter="soon">Em breve</button>
        <button class="filter-pill" data-filter="unavailable">Indisponíveis</button>
      </div>
      <button id="btn-new" class="btn btn-primary btn-sm">+ Nova solução</button>
    </div>

    <!-- Tabela -->
    <table class="admin-table">
      <thead>
        <tr>
          <th>Solução</th>
          <th style="width: 140px;">Status</th>
          <th style="width: 130px;">Preço</th>
          <th style="width: 140px;">ID</th>
          <th style="width: 100px; text-align: right;">Ações</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

  </div>
</main>

<!-- Modal criar/editar -->
<div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-labelledby="modal-title">
    <div class="modal-header">
      <h3 id="modal-title">Nova solução</h3>
      <button class="icon-btn" id="modal-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <form id="modal-form">
      <input type="hidden" id="form-id">

      <div class="form-field">
        <label for="form-title">Título</label>
        <input class="form-input" type="text" id="form-title" required placeholder="Ex: Agenda Online">
      </div>

      <div class="form-field">
        <label for="form-short">Descrição curta</label>
        <textarea class="form-input" id="form-short" rows="2" required placeholder="Uma linha que aparece no card do catálogo"></textarea>
      </div>

      <div class="form-field">
        <label for="form-long">Descrição longa</label>
        <textarea class="form-input" id="form-long" rows="3" placeholder="Texto completo da página de detalhes"></textarea>
      </div>

      <div class="form-field">
        <label for="form-image">URL da imagem</label>
        <input class="form-input" type="url" id="form-image" placeholder="https://…">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-field">
          <label for="form-icon">Ícone</label>
          <select class="form-input" id="form-icon"></select>
        </div>
        <div class="form-field">
          <label for="form-status">Status</label>
          <select class="form-input" id="form-status"></select>
        </div>
      </div>

      <div class="form-field">
        <label for="form-price">Preço</label>
        <input class="form-input" type="text" id="form-price" placeholder="R$ 297/mês">
      </div>

      <div class="form-field">
        <label for="form-features">Features (separadas por vírgula)</label>
        <input class="form-input" type="text" id="form-features" placeholder="lembretes, multi-usuário, integração WhatsApp">
      </div>

      <div class="modal-actions">
        <button type="button" id="delete-from-modal" class="btn btn-ghost btn-sm danger-only" style="color: #fca5a5; border-color: rgba(239,68,68,0.25);">Remover</button>
        <button type="button" id="modal-cancel" class="btn btn-ghost btn-sm">Cancelar</button>
        <button type="submit" class="btn btn-primary btn-sm">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span id="toast-text"></span>
</div>

<script src="../../app/models/ApiModel.js"></script>
<script src="../../app/models/AuthModel.js"></script>
<script src="../../app/models/SeedModel.js"></script>
<script src="../../app/controllers/LayoutController.js"></script>
<script src="../../app/controllers/AdminController.js"></script>

</body>
</html>
